  <!-- Probability Gauge + Gold CTA -->
  <line x1="92" y1="554" x2="828" y2="554" stroke="#23324D" stroke-width="1"/>
  <text x="92" y="582" fill="#CBD5E1" font-size="12.5" font-family="JetBrains Mono, monospace">Próg rentowności (Break-even z podatkiem 12%): 22.41% | Kelly (0.25×): 1.48% budżetu</text>
  <text x="92" y="604" fill="#94A3B8" font-size="11.5">EV netto = 0.2602 × 4.4616 - 1 = +16.09% (z korektą wariancji ligowej: +11.4%)</text>

  <!-- 10% Alpha Gold CTA -->
  <rect x="650" y="566" width="184" height="44" rx="10" fill="#F59E0B"/>
  <text x="742" y="593" text-anchor="middle" fill="#0B0F19" font-size="13.5" font-weight="800">ZAPISZ / SYMULUJ</text>
