services:
  - type: web
    name: quantkupon-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install --upgrade pip && pip install -e packages/quant-engine -e packages/bookmaker-adapters -e apps/api"
    startCommand: "uvicorn apps.api.src.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://quantkupon.pages.dev"
      - key: DATABASE_URL
        sync: false
      - key: OFFLINE_MODE
        value: "false"
