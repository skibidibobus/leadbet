name: Pre-Match Odds & Model Ingest (2x/day)

on:
  schedule:
    # Twice daily at 08:00 and 16:00 UTC (pre-match only, 0 PLN free-tier budget)
    - cron: '0 8,16 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt || pip install fastapi pydantic httpx pytest
          pip install -e packages/quant-engine -e packages/bookmaker-adapters

      - name: Run pre-match ingestion
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: apps/api:packages/quant-engine:packages/bookmaker-adapters
        run: |
          python apps/api/src/cron_ingest.py
