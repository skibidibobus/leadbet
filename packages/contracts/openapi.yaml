openapi: 3.1.0
info:
  title: QUANTKUPON API
  version: 1.0.0
  description: >
    Matematyczna platforma analiz sportowych i generator kuponów bukmacherskich QUANTKUPON.
    Udostępnia predykcje modeli ilościowych (Dixon-Coles xG, Pace, Markov, Skellam), de-vigging,
    kalkulator podatkowy (12% turnover tax, promocje 0%, PIT 10% powyżej 2280 PLN) oraz solver AKO.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.quantkupon.pl
    description: Serwer produkcyjny API
  - url: http://127.0.0.1:8000
    description: Lokalny serwer deweloperski FastAPI
  - url: /
    description: Relatywny endpoint (reverse proxy / monorepo)

paths:
  /api/v1/categories:
    get:
      summary: Lista kategorii sportowych
      description: Zwraca listę kategorii sportowych z informacją o aktywności (v1 vs Faza 2), modelach matematycznych i liczbie nadchodzących zdarzeń.
      operationId: getCategories
      security: []
      parameters:
        - name: enabled_only
          in: query
          description: Filtruj wyłącznie aktywne sporty w wersji produkcyjnej v1
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Pomyślnie pobrano listę kategorii
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/events:
    get:
      summary: Filtrowana lista nadchodzących meczów
      description: Zwraca listę pre-match zdarzeń z kursami bukmacherskimi, prawdopodobieństwami modeli oraz wyliczonym Expected Value (EV).
      operationId: getEvents
      security: []
      parameters:
        - name: sport
          in: query
          description: Slug dyscypliny (football, basketball, tennis, hockey)
          required: false
          schema:
            type: string
            enum: [football, basketball, tennis, hockey, volleyball, table_tennis]
        - name: league_id
          in: query
          description: Identyfikator ligi/rozgrywek
          required: false
          schema:
            type: integer
        - name: market
          in: query
          description: Klucz rynku zakładów (1x2, spread, totals_2_5, moneyline)
          required: false
          schema:
            type: string
        - name: min_ev
          in: query
          description: Minimalna wartość Net EV (np. 0.00 dla wartościowych typów +EV)
          required: false
          schema:
            type: number
        - name: status
          in: query
          description: Status zdarzenia
          required: false
          schema:
            type: string
            enum: [pre_match, live, finished, cancelled]
            default: pre_match
        - name: limit
          in: query
          description: Liczba zwracanych rekordów
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Przesunięcie stronicowania
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Lista zdarzeń sportowych
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/events/{id}/breakdown:
    get:
      summary: Szczegółowy matematyczny breakdown meczu
      description: Zwraca pełną dekompozycję matematyczną (macierz Poissona 8x8, stany łańcucha Markowa, parametry Skellama, metryki Elo/xG/Pace, czynniki faktograficzne i wagi Bayesian fusion).
      operationId: getEventBreakdown
      security: []
      parameters:
        - name: id
          in: path
          description: Identyfikator zdarzenia (np. ft_pl_20261112_ars_che)
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Szczegółowa dekompozycja matematyczna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBreakdownResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/slips/generate:
    post:
      summary: Generowanie optymalnych kuponów AKO
      description: Kombinatoryczny algorytm wyszukiwania maksymalizujący prawdopodobieństwo P(kuponu) w zadanym przedziale kursowym z uwzględnieniem Anti-Correlation Guard, profilu podatkowego (0.88x lub promocja 0%) oraz progu 10% PIT (2280 PLN).
      operationId: generateSlips
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlipGenerateRequest'
      responses:
        '200':
          description: Wygenerowano zoptymalizowane propozycje kuponów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlipGenerateResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/slips/evaluate:
    post:
      summary: Natychmiastowe przeliczenie kuponu i nadpisanie kursów bukmacherskich
      description: Przelicza na żywo kursy całkowite, prawdopodobieństwo łączne, podatek od gier, podatek PIT 10% (>2280 PLN), Net EV oraz ułamek Kelly'ego przy zmianie stawki lub ręcznym nadpisaniu kursów (1-click override).
      operationId: evaluateSlip
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlipEvaluateRequest'
      responses:
        '200':
          description: Wynik dynamicznego przeliczenia kuponu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlipEvaluateResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/slips/saved:
    get:
      summary: Pobierz zapisane kupony użytkownika
      description: Zwraca listę kuponów zapisanych na koncie uwierzytelnionego użytkownika.
      operationId: getSavedSlips
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Lista zapisanych kuponów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSlipListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Zapisz kupon na koncie użytkownika
      description: Utrwala skonfigurowany lub wygenerowany kupon w bazie Neon PostgreSQL dla zalogowanego gracza.
      operationId: saveSlip
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSlipRequest'
      responses:
        '201':
          description: Pomyślnie zapisano kupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSlipResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/slips/saved/{id}:
    delete:
      summary: Usuń zapisany kupon
      description: Usuwa trwale wskazany kupon z konta użytkownika.
      operationId: deleteSavedSlip
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          description: Identyfikator UUID zapisanego kuponu
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Kupon został usunięty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/calibration/metrics:
    get:
      summary: Metryki kalibracji modeli i audytu ilościowego
      description: Zwraca metryki wiarygodności modeli (Brier Score, Brier Skill Score, Log-Loss), Closing Line Value (CLV outperformance wobec Pinnacle) oraz koszyki diagramu niezawodności.
      operationId: getCalibrationMetrics
      security: []
      parameters:
        - name: sport
          in: query
          description: Opcjonalne filtrowanie po dyscyplinie
          required: false
          schema:
            type: string
            enum: [football, basketball, tennis, hockey]
        - name: time_horizon
          in: query
          description: Horyzont czasowy audytu
          required: false
          schema:
            type: string
            enum: [30d, 90d, 180d, 1y, all]
            default: 90d
      responses:
        '200':
          description: Metryki kalibracyjne modeli
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationMetricsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standardowy nagłówek uwierzytelniania Bearer token
    SessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: Ciasteczko sesyjne Auth.js

  responses:
    BadRequestError:
      description: Błąd walidacji żądania lub niespełnione warunki wstępne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Brak uwierzytelnienia lub nieważny token sesji
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Wskazany zasób nie został odnaleziony
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Nieoczekiwany błąd wewnętrzny serwera
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --- Category Schemas ---
    CategoryListResponse:
      type: object
      required:
        - categories
        - total
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SportCategory'
        total:
          type: integer
          example: 6

    SportCategory:
      type: object
      required:
        - id
        - slug
        - name_pl
        - is_enabled_v1
        - volatility_tier
        - active_model
        - fixtures_count
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          enum: [football, basketball, tennis, hockey, volleyball, table_tennis]
          example: football
        name_pl:
          type: string
          example: Piłka nożna
        is_enabled_v1:
          type: boolean
          description: Flaga aktywności w wersji v1 (true dla football, basketball, tennis, hockey)
          example: true
        volatility_tier:
          type: string
          enum: [low, standard, high]
          example: standard
        active_model:
          type: string
          example: dixon_coles_xg_v1
        fixtures_count:
          type: integer
          example: 42
        updated_at:
          type: string
          format: date-time

    # --- Event Schemas ---
    EventListResponse:
      type: object
      required:
        - events
        - total
        - limit
        - offset
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        total:
          type: integer
          example: 120
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0

    EventSummary:
      type: object
      required:
        - id
        - sport_slug
        - sport_name_pl
        - league_id
        - league_name
        - home_team
        - away_team
        - start_time_utc
        - status
        - primary_market
        - max_ev_net
        - is_value_bet
      properties:
        id:
          type: string
          example: ft_pl_20261112_ars_che
        sport_slug:
          type: string
          example: football
        sport_name_pl:
          type: string
          example: Piłka nożna
        league_id:
          type: integer
          example: 101
        league_name:
          type: string
          example: Premier League
        league_country:
          type: [string, "null"]
          example: Anglia
        home_team:
          type: [string, "null"]
          example: Arsenal FC
        away_team:
          type: string
          example: Chelsea FC
        start_time_utc:
          type: string
          format: date-time
          example: '2026-11-14T17:30:00Z'
        status:
          type: string
          enum: [pre_match, live, finished, cancelled]
          example: pre_match
        surface_or_format:
          type: [string, "null"]
          example: Grass
        primary_market:
          $ref: '#/components/schemas/MarketSummary'
        all_markets_count:
          type: integer
          example: 12
        max_ev_net:
          type: number
          format: double
          description: Najwyższa wartość Net EV spośród typów na ten mecz
          example: 0.0583
        is_value_bet:
          type: boolean
          description: Flaga czy zdarzenie zawiera co najmniej 1 selekcję o dodatnim Net EV
          example: true

    MarketSummary:
      type: object
      required:
        - market_key
        - market_label
        - outcomes
      properties:
        market_key:
          type: [string, "null"]
          example: 1x2
        market_label:
          type: string
          example: Wynik meczu (1X2)
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/MarketOutcome'

    MarketOutcome:
      type: object
      required:
        - outcome_key
        - outcome_label
        - best_bookmaker
        - odds_decimal
        - p_model
        - p_sharp
        - p_true
        - fair_odds
        - ev_standard_pl
        - ev_taxfree_pl
        - is_value_bet
        - kelly_fraction
      properties:
        outcome_key:
          type: string
          example: home
        outcome_label:
          type: string
          example: '1'
        best_bookmaker:
          type: string
          example: betclic
        odds_decimal:
          type: number
          format: double
          example: 1.85
        p_model:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          example: 0.582
        p_sharp:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          example: 0.565
        p_true:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          example: 0.572
        fair_odds:
          type: number
          format: double
          example: 1.748
        ev_standard_pl:
          type: number
          format: double
          description: EV przy ustawowym podatku 12% (p_true * odds * 0.88 - 1)
          example: -0.0688
        ev_taxfree_pl:
          type: number
          format: double
          description: EV w promocji bez podatku (p_true * odds - 1)
          example: 0.0582
        is_value_bet:
          type: boolean
          example: true
        kelly_fraction:
          type: number
          format: double
          minimum: 0.0
          maximum: 0.05
          example: 0.018

    # --- Breakdown Schemas ---
    EventBreakdownResponse:
      type: object
      required:
        - event_id
        - sport
        - league_name
        - home_team
        - away_team
        - start_time_utc
        - status
        - model_name
        - model_version
        - bayesian_fusion
        - competitor_ratings
        - factual_factors
        - available_markets
      properties:
        event_id:
          type: string
          example: ft_pl_20261112_ars_che
        sport:
          type: string
          example: football
        league_name:
          type: string
          example: Premier League
        home_team:
          type: string
          example: Arsenal FC
        away_team:
          type: string
          example: Chelsea FC
        start_time_utc:
          type: string
          format: date-time
          example: '2026-11-14T17:30:00Z'
        status:
          type: string
          example: pre_match
        surface_or_format:
          type: [string, "null"]
          example: Grass
        model_name:
          type: [string, "null"]
          example: dixon_coles_xg_v1
        model_version:
          type: string
          example: dc_xg_1.2
        bayesian_fusion:
          $ref: '#/components/schemas/BayesianFusionSummary'
        football_breakdown:
          $ref: '#/components/schemas/FootballBreakdown'
        basketball_breakdown:
          $ref: '#/components/schemas/BasketballBreakdown'
        tennis_breakdown:
          $ref: '#/components/schemas/TennisBreakdown'
        hockey_breakdown:
          $ref: '#/components/schemas/HockeyBreakdown'
        competitor_ratings:
          $ref: '#/components/schemas/CompetitorRatingsSummary'
        factual_factors:
          type: array
          items:
            $ref: '#/components/schemas/FactualFactor'
        available_markets:
          type: array
          items:
            $ref: '#/components/schemas/MarketPredictionDetail'

    BayesianFusionSummary:
      type: object
      required:
        - model_weight
        - sharp_weight
        - sharp_bookmaker
        - devig_method_applied
        - market_margin_devigged
      properties:
        model_weight:
          type: number
          format: double
          example: 0.45
        sharp_weight:
          type: number
          format: double
          example: 0.55
        sharp_bookmaker:
          type: string
          example: pinnacle
        devig_method_applied:
          type: string
          enum: [shin, power, multiplicative]
          example: shin
        market_margin_devigged:
          type: number
          format: double
          example: 0.024
        shin_z_parameter:
          type: [number, "null"]
          format: double
          example: 0.021
        power_c_exponent:
          type: [number, "null"]
          format: double
          example: 1.042

    FootballBreakdown:
      type: object
      required:
        - lambda_home
        - mu_away
        - rho_correlation
        - xg_home_adjusted
        - xg_away_adjusted
        - home_advantage
        - score_matrix_8x8
        - most_likely_scores
      properties:
        lambda_home:
          type: number
          format: double
          description: Oczekiwana liczba bramek gospodarzy
          example: 1.84
        mu_away:
          type: number
          format: double
          description: Oczekiwana liczba bramek gości
          example: 1.12
        rho_correlation:
          type: number
          format: double
          description: Parametr korelacji niskich wyników (Dixon-Coles tau)
          example: -0.11
        xg_weight:
          type: number
          format: double
          default: 0.70
          example: 0.70
        goals_weight:
          type: number
          format: double
          default: 0.30
          example: 0.30
        xg_home_adjusted:
          type: number
          format: double
          example: 1.92
        xg_away_adjusted:
          type: number
          format: double
          example: 1.05
        home_advantage:
          type: number
          format: double
          example: 1.22
        score_matrix_8x8:
          type: array
          description: Macierz prawdopodobieństw wyników od 0:0 do 7:7
          items:
            type: array
            items:
              type: number
              format: double
        most_likely_scores:
          type: array
          items:
            $ref: '#/components/schemas/ScoreProbability'

    ScoreProbability:
      type: object
      required:
        - home_goals
        - away_goals
        - probability
      properties:
        home_goals:
          type: integer
          example: 2
        away_goals:
          type: integer
          example: 1
        probability:
          type: number
          format: double
          example: 0.108

    BasketballBreakdown:
      type: object
      required:
        - expected_pace
        - league_avg_pace
        - ortg_home
        - drtg_home
        - ortg_away
        - drtg_away
        - mu_points_home
        - mu_points_away
        - sigma_diff
        - sigma_tot
      properties:
        expected_pace:
          type: number
          format: double
          example: 101.4
        league_avg_pace:
          type: number
          format: double
          example: 99.2
        ortg_home:
          type: number
          format: double
          example: 114.5
        drtg_home:
          type: number
          format: double
          example: 110.2
        ortg_away:
          type: number
          format: double
          example: 112.1
        drtg_away:
          type: number
          format: double
          example: 113.8
        mu_points_home:
          type: number
          format: double
          example: 116.8
        mu_points_away:
          type: number
          format: double
          example: 111.4
        sigma_diff:
          type: number
          format: double
          example: 11.8
        sigma_tot:
          type: number
          format: double
          example: 17.5
        home_court_advantage_pts:
          type: number
          format: double
          example: 2.8

    TennisBreakdown:
      type: object
      required:
        - surface
        - match_format
        - p_serve_player_a
        - p_serve_player_b
        - p_game_a
        - p_game_b
        - p_tiebreak_a
        - p_set_a
        - player_a_surface_elo
        - player_b_surface_elo
      properties:
        surface:
          type: string
          enum: [Hard, Clay, Grass]
          example: Clay
        match_format:
          type: string
          enum: [Bo3, Bo5]
          example: Bo3
        p_serve_player_a:
          type: number
          format: double
          example: 0.652
        p_serve_player_b:
          type: number
          format: double
          example: 0.618
        p_game_a:
          type: number
          format: double
          example: 0.812
        p_game_b:
          type: number
          format: double
          example: 0.748
        p_tiebreak_a:
          type: number
          format: double
          example: 0.584
        p_set_a:
          type: number
          format: double
          example: 0.625
        player_a_surface_elo:
          type: number
          format: double
          example: 2045.0
        player_b_surface_elo:
          type: number
          format: double
          example: 1930.0

    HockeyBreakdown:
      type: object
      required:
        - lambda_home
        - mu_away
        - empty_net_multiplier
        - empty_net_time_window_min
        - regulation_draw_prob
        - skellam_diff_distribution
      properties:
        lambda_home:
          type: number
          format: double
          example: 3.15
        mu_away:
          type: number
          format: double
          example: 2.65
        empty_net_multiplier:
          type: number
          format: double
          default: 3.20
          example: 3.20
        empty_net_time_window_min:
          type: number
          format: double
          default: 2.0
          example: 2.0
        regulation_draw_prob:
          type: number
          format: double
          example: 0.224
        skellam_diff_distribution:
          type: array
          items:
            $ref: '#/components/schemas/GoalDiffProbability'

